[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=--image-base=0xffffffff80000000",
    "-C", "relocation-model=static",
]

[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "link-arg=--image-base=0xffff000040100000",
    "-C", "relocation-model=static",
]
